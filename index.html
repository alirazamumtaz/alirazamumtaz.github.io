    <script>
      // No-flash theme: set .dark on <html> before first paint.
      ;(function () {
        try {
          var stored = window.localStorage.getItem('theme')
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>

    <script>
      // GitHub Pages SPA redirect restore (see public/404.html)
      ;(function () {
        var redirect = new URLSearchParams(window.location.search).get('p')
        if (!redirect) return
        var restoredPath = decodeURIComponent(redirect)
        var newUrl = window.location.origin + restoredPath + window.location.hash
        window.history.replaceState(null, '', newUrl)
      })()
    </script>
